name: Deploy to VPS

on:
  push:
    branches:
      - main # Or your default branch (e.g., master)

jobs:
  validate:
    name: 🧪 Run Automated Tests & Validate Build
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚡ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: 📦 Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: 🔑 Generate App Key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: 🧪 Execute PHP Test Suite
        run: php artisan test

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔨 Validate Frontend Compilation
        run: |
          npm ci || npm install
          npm run build

  deploy:
    name: 🚀 Deploy to VPS
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚡ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          
      - name: 📦 Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: 🚀 Sync Files to VPS (rsync)
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rltgoDzvO --delete"
          SOURCE: "./"
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: "/var/www/mototrack"
          EXCLUDE: "/.git/, /.github/, /node_modules/, /.env, /storage/, /tests/"

      - name: 🔄 Run Commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/mototrack
            
            # Install Node modules and build assets on VPS so Vite can access .env
            npm install
            npm run build
            
            # Ensure correct permissions for web server
            chown -R www-data:www-data /var/www/mototrack/storage /var/www/mototrack/bootstrap/cache /var/www/mototrack/public/build
            
            # Run Laravel optimizations as the web server user
            sudo -u www-data php artisan migrate --force
            sudo -u www-data php artisan optimize:clear
            sudo -u www-data php artisan config:cache
            sudo -u www-data php artisan route:cache
            sudo -u www-data php artisan view:cache
